# ==== Marker-aware 3-Channel Cellpose Pipeline (c1, c2, c3) ====

# Root folder with your .czi files
input_dir: "/scratch/brussel/vo/000/bvo00026/vsc11013/Projects/REGE-Nusa/Output_Final/Figure_3_panel_H/Magnification/VUB02/slices_256"

# Root folder for outputs (masks + images), preserving the relative directory structure of input_dir.
output_dir: "/scratch/brussel/vo/000/bvo00026/vsc11013/Projects/REGE-Nusa/Output_Final/Figure_3_panel_H/Magnification/VUB02/slices_256"

# For now you have 2D images, but if in future you get Z-stacks:
# This controls how Z is collapsed into one plane for segmentation.
z_strategy: "max"   # or "median"

# Skip files whose names contain any of these substrings (case-insensitive)
exclude_name_contains:
  - "zstack"
  - "orthogonal projection"
  - "overlay"
  - "overview"

# File extensions to process (case-insensitive)
extensions:
  - ".tif"
  - ".tiff"

cellpose:
  use_gpu: true
  force_resample: true         # IMPORTANT: keep masks at original image size
  verbose_resize_fix: true     # prints when a mask had to be resized to match input
  diameter: null               # Global default diameter (null = auto estimate). Override per-channel below.

# ------------------------------------------------------------------
# Markers for which segmentation should NEVER be run (any channel).
# Example: skip all OCT4 channels.
# ------------------------------------------------------------------
skip_markers:
  - EYA1   # Use [] if you do not want to skip any markers

# ------------------------------------------------------------------
# Marker classification – which markers are nuclear / cytoplasmic / etc.
# This is used by the script to choose an appropriate model automatically
# based on the *marker name parsed from the filename*.
#
# From your note:
#   Nuclear – PAX6, OCT4, HAND1, GATA3, TFAP2A, EYA1 (+ DAPI)
#   Cytoplasmic – KRT* and EPCAM
#   Figure 4 – PMEL – Transmembrane, EYA1
# ------------------------------------------------------------------
marker_classes:
  nuclear:
    - PAX6
    - OCT4
    - HAND1
    - GATA3
    - TFAP2A
    - EYA1
    - DAPI

  cytoplasmic:
    - "KRT*"
    - EPCAM

  transmembrane:
    - PMEL

# ------------------------------------------------------------------
# For each marker class, which Cellpose model (or model path) to use.
#
# You can put:
#   - a built-in model name: "nuclei", "cyto", "cyto2", ...
#   - OR an absolute path to your custom .npy/.pt model.
# ------------------------------------------------------------------
marker_models:
  nuclear: "/scratch/brussel/vo/000/bvo00026/vsc11013/Projects/REGE-Nusa/models/cpsam_20qP_nuclei"
  cytoplasmic: "/scratch/brussel/vo/000/bvo00026/vsc11013/Projects/REGE-Nusa/models/cpsam_20q_cells"
  transmembrane: "/scratch/brussel/vo/000/bvo00026/vsc11013/Projects/REGE-Nusa/models/cpsam_20q_cells"

# ------------------------------------------------------------------
# Per-channel configuration.
#
# Filenames look like:
#   Nemo_20q__c1-EYA1-647__c2-PAX6-594__c3-DAPI-405__idx-1.czi
#
# "enabled" lets you completely turn a channel ON/OFF.
# "index" can be 1-based or 0-based:
#   - If 1 <= index <= nC  -> treated as 1-based (1 -> C0, 2 -> C1, 3 -> C2)
#   - If 0 <= index < nC   -> treated as 0-based (0 -> C0, 1 -> C1, 2 -> C2)
#
# NOTE on 'model' here:
#   - If the marker name from the filename matches marker_classes,
#     the script uses marker_models[class] (i.e. class-level mapping).
#   - If there is NO match, it falls back to the per-channel 'model'
#     defined here (or CLI overrides).
# ------------------------------------------------------------------
channels:
  c1:
    index: 1             # corresponds to c1 (EYA1-647)
    enabled: true        # set to false to skip c1 entirely
    model: null          # fallback only if marker not classified
    flow_threshold: 0.8
    cellprob_threshold: -8
    bg_subtract: 1000
    diameter: 2       # null = use global or auto estimate

  c2:
    index: 2             # corresponds to c2 (PAX6-594)
    enabled: true        # set to false to skip c2 entirely
    model: null
    flow_threshold: 0.8
    cellprob_threshold: -8
    bg_subtract: 1000
    diameter: null       # null = use global or auto estimate

  c3:
    index: 3             # corresponds to c3 (DAPI-405)
    enabled: true        # set to false to skip c3 entirely
    model: null
    flow_threshold: 0.8
    cellprob_threshold: -8
    bg_subtract: 20
    diameter: null       # null = use global or auto estimate

save:
  projections: false   # writes *_cX_proj.tif (same as *_cX_img.tif for 2D)
  zstack: false        # only used if you ever have Z-stacks in future
