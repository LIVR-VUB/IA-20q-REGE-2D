# ==== EPCAM–OCT4 Cellpose Pipeline (Per-Channel Models & Thresholds) ====

input_dir: "/scratch/brussel/vo/000/bvo00026/vsc11013/Projects/REGE-Nusa/Raw_data"
output_dir: "/scratch/brussel/vo/000/bvo00026/vsc11013/Projects/REGE-Nusa/Outputs"

z_strategy: "max"   # or "median"

exclude_name_contains:
  - "zstack"
  - "orthogonal projection"
  - "overlay"
  - "overview"

cellpose:
  use_gpu: true

channels:
  epcam:
    # If you know exact indices, set them; leave out to auto-detect.
    # index: 1         # 0-based; 1-based is also accepted
    model: "/scratch/brussel/vo/000/bvo00026/vsc11013/Projects/REGE-Nusa/models/cpsam_EPCAM"  # your EPCAM SAM model
    flow_threshold: null         # e.g., 0.4 (null -> do not pass)
    cellprob_threshold: null     # e.g., 0.0 (null -> do not pass)

  oct4:
    # index: 2
    model: "nuclei"              # or a SAM/custom model path if you prefer
    flow_threshold: 0.8
    cellprob_threshold: -8

save:
  projections: true              # writes *_proj.tif
  zstack: false                  # set true to also write *_z.tif (multi-page)

# quantify: false                 # keep false or remove; segmentation-only
# analyzer_script: "/path/to/analysis.py"
